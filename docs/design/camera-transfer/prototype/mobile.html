<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>RawLab · 相机导入移动端设计</title>
  <link rel="stylesheet" href="mobile.css">
  <script src="mobile.js" defer></script>
</head>
<body>
  <header class="board-header">
    <div class="board-brand"><strong>RawLab</strong><span>相机导入 · 移动端</span><span class="design-tag">交互原型</span></div>
    <a href="index.html">Mac 方案</a>
  </header>
  <nav class="board-controls" aria-label="原型展示设置">
    <div class="view-switch" role="group" aria-label="展示平台">
      <button data-view="compare" aria-pressed="true">两端对照</button>
      <button data-view="ios" aria-pressed="false">iPhone</button>
      <button data-view="android" aria-pressed="false">Android</button>
      <button data-view="tablet" aria-pressed="false">平板</button>
    </div>
    <label class="large-option"><input id="large-type" type="checkbox">大字</label>
    <label class="scene-label">场景<select id="mobile-scenario" aria-label="切换移动端场景">
      <option value="browse">浏览与选片</option>
      <option value="connect">首次连接</option>
      <option value="transfer">正在导入</option>
      <option value="background">从后台返回</option>
      <option value="offline">相机断线</option>
      <option value="partial">部分未完成</option>
      <option value="complete">导入完成</option>
      <option value="restricted">连接受限</option>
      <option value="empty">没有照片</option>
      <option value="draft">编辑草稿待处理</option>
    </select></label>
  </nav>
  <main id="mobile-board" class="mobile-board" data-view="compare">
    <section class="device-column ios-column" aria-label="iPhone 原型">
      <div class="device-label"><strong id="apple-label">iPhone</strong><span>系统导航 · 原生菜单</span></div>
      <div class="phone ios" id="ios-demo" data-os="ios"></div>
    </section>
    <section class="device-column android-column" aria-label="Android 原型">
      <div class="device-label"><strong>Android</strong><span>Material 3 · 系统返回</span></div>
      <div class="phone android" id="android-demo" data-os="android"></div>
    </section>
  </main>
  <footer class="board-footer">点照片勾选，点放大按钮预览。照片、进度和认证均为示例；不会连接相机或保存文件。</footer>
</body>
</html>
