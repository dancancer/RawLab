plugins { id 'com.android.application' }

android {
    namespace 'com.rawlab.cicachesmoke'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        minSdk 26
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
