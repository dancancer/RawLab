[package]
name = "rawlab-x3f"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
x3f-core = { git = "https://github.com/sagwaco/x3fuse-core", rev = "00f9ef206a2d629bca35ceead4b3951833b85d3d", default-features = false }
x3f-sys = { git = "https://github.com/sagwaco/x3fuse-core", rev = "00f9ef206a2d629bca35ceead4b3951833b85d3d", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
